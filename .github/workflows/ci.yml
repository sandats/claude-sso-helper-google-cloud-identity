name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format and build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and development tools
        run: python -m pip install -e '.[dev]'
      - name: Lint Python
        run: python -m ruff check .
      - name: Check Python formatting
        run: python -m ruff format --check .
      - name: Build source distribution and wheel
        run: python -m build
      - name: Check example settings
        run: python -m json.tool examples/claude-settings.example.json > /dev/null

  tests:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install packaged project and development tools
        run: python -m pip install '.[dev]'
      - name: Check dependency compatibility
        run: python -m pip check
      - name: Run offline protocol and security tests
        run: python -m pytest -v
      - name: Check installed commands outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          google-claude-auth --help
          google-claude-verify-gateway --help
          python -m google_claude_auth --help
